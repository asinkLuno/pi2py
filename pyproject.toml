[project]
name = "pi2py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guozr", email = "guozr1997@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.3.0",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "pytest>=9.1.1",
    "randon>=0.0.6",
    "ruff>=0.17.1",
    "ty>=0.0.88",
    "vulture>=2.16",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
