repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: ty-check
        name: ty check
        entry: .venv/bin/ty check
        language: system
        types: [python]
      - id: vulture
        name: vulture
        entry: .venv/bin/vulture src/pi2py --ignore-names 'content,run_skill,print_response,node_version,exit_code,alive,model_config,exc_info,usage'
        language: system
        types: [python]
        pass_filenames: false
      - id: radon
        name: radon cc
        entry: .venv/bin/radon cc -s -nc src/pi2py
        language: system
        types: [python]
        pass_filenames: false
      - id: mdformat
        name: mdformat
        entry: .venv/bin/mdformat
        language: system
        types: [markdown]
